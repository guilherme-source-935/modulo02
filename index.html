<!DOCTYPE html> <!--Informa ao navegador que este documento usa HTML5-->
<html lang="pt-BR"> <!--Marca o inicio da pagina HTML. O atributo lang="pt-BR" indica que o idioma principal é português-->
<head> <!--Cabeçalho da página. Aqui fica as configurações e informações que não aparecem no corpo da página-->
    <meta charset="UTF-8"> <!--Define o padrão de caracteres. Permite acentos, ç, emojis e outros caracteres especiais-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Faz a página se adaptar a celulares e computadores-->
    <title>Meu Primeiro Site</title> <!--Título da página, aparece na aba do navegador-->
</head> <!--Fecha a tag head-->
<body><!--Corpo da página. Tudo que aparece para o usuário fica aqui-->
    <h1>Bem vindo ao meu site</h1>
    <h2>Site para o estudo do meu curso de fullstack</h2>
    <p>Está é uma estrutura HTML básica</p>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>Javascript</li>
    </ul>
</body>
</html>
